services:
  torrent115:
    image: torrent115:__T115_TAG__
    container_name: torrent115
    restart: unless-stopped
    network_mode: host
    volumes:
      - "${TRIM_PKGVAR}/data:/data"
      # fnOS 下载中心目录（可选；不存在时下载器功能自动不可用）
      - /usr/trim/var/downloadcenter:/downloadcenter:ro
    environment:
      - TZ=Asia/Shanghai
      - T115_ADMIN_USER=${t115_admin_user:-admin}
      - T115_ADMIN_PASSWORD=${t115_admin_password:-}
